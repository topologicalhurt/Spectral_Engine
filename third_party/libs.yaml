# Third-party dependency manifest — managed by `python -m spectral_tools.vendor`
# Schema + rules: tools/spectral_tools/vendor/manifest.py (ADR-0003)
version: 1
dependencies:
  CMSIS-DSP:
    kind: submodule
    url: https://github.com/ARM-software/CMSIS-DSP
    path: third_party/CMSIS-DSP
    ref: main
    sparse:
    - Include
    - Source/TransformFunctions
    - Source/CommonTables
    - Source/BasicMathFunctions
    - Source/FastMathFunctions
    - PrivateInclude
    notes: pinned at tag v1.16.2 via the gitlink; Q15/Q31 FFT for the F-stream IFFT
      synthesis path (rfft measured on the QEMU rig, pass 255)
  CMSIS_6:
    kind: submodule
    url: https://github.com/ARM-software/CMSIS_6
    path: third_party/CMSIS_6
    ref: main
    sparse:
    - CMSIS/Core/Include
  simde:
    kind: submodule
    url: https://github.com/simd-everywhere/simde
    path: third_party/simde
    ref: master
    notes: header-only SIMD portability; host SIMD paths compile SSE2 intrinsics through
      it
  xxHash:
    kind: submodule
    url: https://github.com/Cyan4973/xxHash
    path: third_party/xxHash
    ref: dev
    notes: resource hash system (xx32/xx3)
