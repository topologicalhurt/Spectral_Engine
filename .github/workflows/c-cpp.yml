name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ctest-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install libomp libsndfile
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build desktop + tests
        run: cmake --build build --target desktop tests_all --parallel
      - name: ctest
        run: ctest --test-dir build --output-on-failure

  ctest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libomp-dev libsndfile1-dev libfftw3-dev
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build desktop + tests
        run: cmake --build build --target desktop tests_all --parallel
      - name: ctest
        run: ctest --test-dir build --output-on-failure

  pytest-behavioral:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install libomp libsndfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: pytest
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/core_math -q
